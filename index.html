<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Imona — Ko‘paytirish jadvali</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#6366f1">

  <!-- iOS home-screen install -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Matematika">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./app.css">
</head>
<body>

  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div class="bg-symbols" id="bgSymbols" aria-hidden="true"></div>

  <div class="app">

    <header class="topbar">
      <div class="greeting">
        <h1 id="greeting">Salom, Imona!</h1>
        <p id="subtitle">Ko‘paytirish jadvalini o‘rganamiz</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="langBtn" type="button" aria-label="Language">EN</button>
        <button class="icon-btn" id="soundBtn" type="button" aria-label="Sound">🔊</button>
      </div>
    </header>

    <section class="stats" aria-label="progress">
      <div class="stat">
        <span class="stat-emoji">🔥</span>
        <span class="stat-value" id="streakValue">0</span>
        <span class="stat-label" id="streakLabel">kunlik seriya</span>
      </div>
      <div class="stat">
        <span class="stat-emoji">🏆</span>
        <span class="stat-value"><span id="trophyValue">0</span>/8</span>
        <span class="stat-label" id="trophyLabel">kubok</span>
      </div>
      <div class="stat">
        <span class="stat-emoji">⭐</span>
        <span class="stat-value"><span id="factsValue">0</span>/64</span>
        <span class="stat-label" id="factsLabel">misol</span>
      </div>
    </section>

    <h2 class="section-title" id="tablesTitle">Jadvallar</h2>
    <div class="table-grid" id="tableGrid"></div>

    <div class="install-hint" id="installHint" hidden>
      <div class="install-icon">📲</div>
      <div class="install-text">
        <strong id="installTitle">Bosh ekranga qo‘shish</strong>
        <span id="installBody">Chrome’da: ⋮ menyu → «Ilovani o‘rnatish»</span>
      </div>
      <button class="install-action" id="installAction" type="button" hidden>O‘rnatish</button>
      <button class="install-close" id="installClose" type="button" aria-label="Close">✕</button>
    </div>

    <footer class="footer">
      <span id="footerNote">2-sinf • Ko‘paytirish jadvali</span>
    </footer>

  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-emoji" id="sheetEmoji">🚧</div>
      <h3 id="sheetTitle">Tez orada!</h3>
      <p id="sheetBody">Bu qism tayyorlanmoqda.</p>
      <button class="btn-primary" id="sheetBtn" type="button">Yaxshi</button>
    </div>
  </div>

  <script src="./lib/fx.js"></script>
  <script src="./lib/i18n.js"></script>
  <script src="./app.js"></script>
</body>
</html>
